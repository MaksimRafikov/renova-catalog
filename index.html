  <body>
    <header class="site-header">
      <div class="site-header__inner">
        <a class="logo" href="index.html" aria-label="РеНова+">
          <img
            class="logo__img"
            src="assets/brand/logo-header.png"
            alt="РеНова+"
            width="789"
            height="224"
          />
        </a>
        <nav class="nav-links" aria-label="Навигация">
          <a href="?branch=design" data-branch-nav="design">Дизайн</a>
          <a href="?branch=repair" data-branch-nav="repair">Ремонт</a>
          <a href="contacts.html">Контакты</a>
          <button type="button" class="nav-cta js-open-lead">Заявка</button>
          <a class="nav-ext" href="https://remontvufe.ru/" target="_blank" rel="noopener noreferrer">Сайт РеНова+</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="gate" id="gate" aria-label="Выбор направления">
        <div class="gate__media">
          <picture>
            <source type="image/webp" srcset="assets/brand/hero/hero-team.webp" />
            <img
              class="gate__img"
              src="assets/brand/hero/hero-team.jpg"
              alt="Команда РеНова+ в студии"
              width="1024"
              height="768"
              decoding="async"
              fetchpriority="high"
            />
          </picture>
        </div>
        <div class="gate__copy">
          <h1 class="gate__title">Каталог объектов</h1>
          <div class="gate__actions">
            <a class="btn gate__btn" href="?branch=design">Дизайн</a>
            <a class="btn btn--primary gate__btn gate__btn--sky" href="?branch=repair">Ремонт</a>
          </div>
        </div>
      </section>

      <div class="container page-flow" id="catalog-shell">
        <div id="catalog-view" hidden>
          <header class="branch-head">
            <h1 class="branch-head__title" id="branch-title">Дизайны</h1>
          </header>

          <section class="filters" id="catalog" aria-label="Фильтры каталога">
            <div class="filters__bar">
              <button
                type="button"
                class="filter-toggle"
                id="filter-toggle"
                aria-expanded="false"
                aria-controls="filter-panel"
              >
                Фильтры
              </button>
              <div class="filters__panel" id="filter-panel" hidden>
                <div class="filter-row filter-row--complex">
                  <span class="filter-label">Жилой комплекс</span>
                  <div id="filter-complex" class="filter-complex-chips"></div>
                </div>
                <div class="filter-row filter-row--area">
                  <span class="filter-label">Площадь</span>
                  <div id="filter-area" class="filter-complex-chips"></div>
                </div>
              </div>
            </div>
            <p id="filter-status" class="filter-status" aria-live="polite"></p>
          </section>

          <div id="case-grid" class="grid" aria-live="polite"></div>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container">
        <div class="site-footer__top">
          <div class="site-footer__brand">
            <strong>РеНова+ · Дизайн и ремонт</strong>
          </div>
          <div class="site-footer__actions">
            <button type="button" class="btn btn--primary js-open-lead">Оставить заявку</button>
            <a class="btn btn--ghost" href="tel:+79177709099">Позвонить менеджеру</a>
          </div>
        </div>
        <div class="site-footer__legal">
          <p>
            ИП Асфандияров Руслан Салаватович · ОГРНИП 322028000132161 · ИНН 027406145740
          </p>
          <p class="site-footer__links">
            <a href="privacy.html">Политика конфиденциальности</a>
          </p>
        </div>
        <p class="site-footer__credit">
          Разработка сайта —
          <a href="https://maximrafikov.ru/" target="_blank" rel="noopener noreferrer">Максим Рафиков</a>
